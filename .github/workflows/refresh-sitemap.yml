name: Refresh sitemap
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Revalidate sitemap
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITEMAP_REVALIDATE_TOKEN: ${{ secrets.SITEMAP_REVALIDATE_TOKEN }}
        run: |
          test -n "$SITE_URL"
          test -n "$SITEMAP_REVALIDATE_TOKEN"
          curl --fail-with-body --connect-timeout 10 --max-time 30 --retry 3 --request POST \
            --header "Authorization: Bearer $SITEMAP_REVALIDATE_TOKEN" \
            "$SITE_URL/api/refresh-sitemap"
          curl --fail-with-body --connect-timeout 10 --max-time 30 --retry 3 "$SITE_URL/sitemap.xml" > /dev/null
